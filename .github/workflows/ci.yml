name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test push endpoint validation
        run: deno test supabase/functions/_shared/push-endpoint.test.ts
      - name: Type-check push Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/trx-vapid-generator/index.ts supabase/functions/trx-push-config/index.ts supabase/functions/trx-push-subscribe/index.ts supabase/functions/trx-push-unsubscribe/index.ts supabase/functions/trx-push-dispatch/index.ts
      - name: Install dependencies
        run: npm install
      - name: TypeScript and production build
        run: npm run build
